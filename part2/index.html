<!doctype html>
<html lang="ckb" dir="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Karez | Part 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=Inter:wght@500;600&display=swap">
<style>
/* Layout: one centered column, a single large tappable button */
:root{--bg:#f6f3ee;--fg:#16203a;--muted:#5d6678;--gold:#b8893a;--btn:#16203a;--btn-fg:#f6f3ee;--line:#d9d2c4;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--fg:#ffffff;--muted:#b9c0d0;--gold:#d4af6a;--btn:#d4af6a;--btn-fg:#0e1424;--line:#2b3550;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--fg:#ffffff;--muted:#b9c0d0;--gold:#d4af6a;--btn:#d4af6a;--btn-fg:#0e1424;--line:#2b3550;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Noto Naskh Arabic","Inter",system-ui,sans-serif;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:center}
main{width:100%;max-width:420px;text-align:center;display:flex;flex-direction:column;gap:22px}
.tag{font-family:"Inter",sans-serif;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{font-size:64px;line-height:1.25;margin:0;font-weight:700;text-wrap:balance}
p{margin:0;font-size:22px;line-height:1.7;color:var(--muted)}
.btn{display:block;background:var(--btn);color:var(--btn-fg);text-decoration:none;font-weight:700;font-size:24px;padding:20px 24px;border-radius:999px;line-height:1.5}
.btn small{display:block;font-family:"Inter",sans-serif;font-size:14px;font-weight:600;letter-spacing:.06em;opacity:.85}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.foot{font-family:"Inter",sans-serif;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:18px}
</style>
</head>
<body>
<main>
  <div class="tag">Part 2</div>
  <h1>بەشی دووەم</h1>
  <p>وەڵامەکە لە ڤیدیۆی دووەمدایە<br>الإجابة في الفيديو الثاني</p>
  <a class="btn" href="https://www.instagram.com/reel/Dezey1Vtav8/" target="_blank" rel="noopener">
    بینینی ڤیدیۆکە · مشاهدة الفيديو
    <small>OPEN ON INSTAGRAM ▶</small>
  </a>
  <div class="foot">@karez.digital</div>
</main>
</body>
</html>
